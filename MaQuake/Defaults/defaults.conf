# macuake-glass defaults: a macOS Terminal.app look with a faint translucency.
# Loaded BEFORE the user's Ghostty config, so anything in
# ~/.config/ghostty/config or ~/Library/Application Support/com.mitchellh.ghostty/config wins.
# Edit the user config, not this file (it lives inside the app bundle).

# Font: Meslo (if installed) -> Menlo (ships with macOS)
font-family = "Meslo LG M DZ for Powerline"
font-family = Menlo
font-size = 14

# Colors come from Resources/ghostty/themes/Mac Terminal
theme = Mac Terminal

cursor-style = block
cursor-style-blink = true
window-padding-x = 8
window-padding-y = 6

# Faint see-through terminal (needs the clear backing layers in this fork).
# Do NOT set background-blur = macos-glass-*: Macuake has no glass view,
# so the renderer would then skip painting the background entirely.
background-opacity = 0.98
